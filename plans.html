<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الحساب المجاني — Silent Loss Detector</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-1: #dfeefb;
            --bg-2: #f3f8fe;
            --card: #ffffff;
            --soft: #f2f7fd;
            --blue-dark: #0b3967;
            --blue-main: #1565c0;
            --blue-light: #dcebfa;
            --text: #0f2942;
            --muted: #4d6b8a;
            --ok: #0e7490;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 28px 14px;
            font-family: "Cairo", sans-serif;
            background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
            color: var(--text);
        }

        .wrap {
            max-width: 720px;
            margin: 0 auto;
            background: var(--card);
            border: 1px solid var(--blue-light);
            border-radius: 16px;
            padding: 26px;
            box-shadow: 0 10px 28px rgba(11, 57, 103, 0.08);
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            border-bottom: 2px solid var(--blue-light);
            padding-bottom: 16px;
            margin-bottom: 22px;
        }

        .title {
            margin: 0;
            font-size: 21px;
            font-weight: 800;
            color: var(--blue-dark);
            font-style: italic;
            transform: skewX(-6deg);
            transform-origin: right center;
        }

        .sub { margin: 4px 0 0; font-size: 13px; color: var(--muted); }

        .back-link {
            text-decoration: none;
            color: var(--blue-main);
            background: var(--soft);
            border: 1px solid var(--blue-light);
            padding: 6px 13px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
        }

        .free-card {
            background: var(--soft);
            border: 1px solid #b8d4f0;
            border-right: 4px solid var(--blue-main);
            border-radius: 12px;
            padding: 22px;
        }

        .plan-name { margin: 0; font-size: 18px; font-weight: 800; color: var(--blue-dark); }
        .price { font-size: 22px; font-weight: 800; color: var(--ok); margin: 6px 0 14px; }

        ul { margin: 0 0 20px; padding-right: 18px; font-size: 13.5px; color: var(--text); }
        li { margin-bottom: 8px; }

        .btn {
            background: linear-gradient(135deg, #1e88e5, var(--blue-dark));
            color: #fff;
            border: none;
            border-radius: 9px;
            padding: 10px 18px;
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
        }

        .flash {
            background: #e3f2fd;
            color: var(--blue-dark);
            border: 1px solid #90caf9;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="top">
            <div>
                <h1 class="title">Silent Loss Detector — {{ company_name }}</h1>
                <p class="sub">جميع ميزات التدقيق وحفظ السجل متاحة مجاناً بدون قيود</p>
            </div>
            <a href="/" class="back-link">العودة للتقرير</a>
        </div>

        {% for _, msg in get_flashed_messages(with_categories=true) %}
            <div class="flash">{{ msg }}</div>
        {% endfor %}

        <form method="POST" class="free-card">
            <h2 class="plan-name">{{ plan.name }}</h2>
            <div class="price">{{ plan.price }}</div>
            <ul>
                {% for f in plan.features %}
                <li>{{ f }}</li>
                {% endfor %}
            </ul>
            <button type="submit" class="btn">مفعّل بالكامل مجاناً</button>
        </form>
    </div>
</body>
</html>
