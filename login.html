<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول — Silent Loss Detector</title>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky-top: #e3f2fd;
            --sky-mid: #f5faff;
            --white: #ffffff;
            --blue-dark: #0d3b66;
            --blue-main: #1976d2;
            --text: #102a43;
            --muted: #527394;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 14px;
            font-family: "Cairo", sans-serif;
            color: var(--text);
            background: linear-gradient(165deg, var(--sky-top) 0%, var(--sky-mid) 52%, var(--white) 100%);
            position: relative;
            overflow-x: hidden;
        }
        .clouds-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .mini-cloud {
            position: absolute;
            width: var(--w, 60px);
            height: calc(var(--w, 60px) * 0.34);
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid rgba(144, 202, 249, 0.6);
            border-radius: 999px;
            box-shadow: 0 4px 12px rgba(25, 118, 210, 0.08);
            animation: drift var(--dur, 25s) linear infinite;
            animation-delay: var(--delay, 0s);
        }
        .mini-cloud::before {
            content: "";
            position: absolute;
            width: calc(var(--w, 60px) * 0.44);
            height: calc(var(--w, 60px) * 0.44);
            background: rgba(255, 255, 255, 0.96);
            border-top: 1px solid rgba(144, 202, 249, 0.6);
            border-left: 1px solid rgba(144, 202, 249, 0.6);
            border-radius: 50%;
            top: calc(var(--w, 60px) * -0.19);
            left: calc(var(--w, 60px) * 0.15);
        }
        .mini-cloud::after {
            content: "";
            position: absolute;
            width: calc(var(--w, 60px) * 0.34);
            height: calc(var(--w, 60px) * 0.34);
            background: rgba(255, 255, 255, 0.96);
            border-top: 1px solid rgba(144, 202, 249, 0.6);
            border-right: 1px solid rgba(144, 202, 249, 0.6);
            border-radius: 50%;
            top: calc(var(--w, 60px) * -0.14);
            right: calc(var(--w, 60px) * 0.17);
        }
        @keyframes drift {
            0% { transform: translateX(-16vw) translateY(0px); }
            50% { transform: translateX(52vw) translateY(-8px); }
            100% { transform: translateX(116vw) translateY(3px); }
        }
        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid #cce4fa;
            border-radius: 26px 12px 26px 12px;
            padding: 26px 24px;
            box-shadow: 0 14px 34px rgba(15, 61, 110, 0.09);
        }
        .brand-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }
        .hero-cloud {
            position: relative;
            background: #ffffff;
            border: 1.5px solid #90caf9;
            border-radius: 999px;
            padding: 14px 28px 12px;
            box-shadow: 0 8px 20px rgba(25, 118, 210, 0.12);
            text-align: center;
        }
        .hero-cloud::before {
            content: "";
            position: absolute;
            width: 66px;
            height: 66px;
            background: #ffffff;
            border-top: 1.5px solid #90caf9;
            border-left: 1.5px solid #90caf9;
            border-radius: 50%;
            top: -26px;
            left: 24px;
            z-index: -1;
        }
        .hero-cloud::after {
            content: "";
            position: absolute;
            width: 52px;
            height: 52px;
            background: #ffffff;
            border-top: 1.5px solid #90caf9;
            border-right: 1.5px solid #90caf9;
            border-radius: 50%;
            top: -20px;
            right: 26px;
            z-index: -1;
        }
        .brand-name {
            margin: 0;
            font-family: "Aref Ruqaa", "Cairo", sans-serif;
            font-size: 27px;
            font-weight: 700;
            color: var(--blue-dark);
            line-height: 1.2;
        }
        .brand-note {
            margin: 14px 0 0;
            font-size: 12.5px;
            color: var(--muted);
            text-align: center;
        }
        .flash {
            padding: 10px 12px;
            border-radius: 14px 6px 14px 6px;
            margin-bottom: 14px;
            font-size: 12.5px;
            background: #eef7ff;
            color: var(--blue-dark);
            border: 1px solid #bbdefb;
        }
        .field-group { margin-bottom: 13px; }
        .field-label {
            display: block;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--blue-dark);
            margin-bottom: 5px;
        }
        .soft-input, .soft-select {
            width: 100%;
            background: #ffffff;
            color: var(--text);
            border: 1.5px solid #c5e1fa;
            border-radius: 16px 6px 16px 6px;
            padding: 10px 14px;
            font-family: inherit;
            font-size: 13.5px;
            transform: skewX(-4deg);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .soft-input:focus, .soft-select:focus {
            outline: none;
            border-color: var(--blue-main);
            box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.14);
        }
        .btn-main {
            width: 100%;
            margin-top: 6px;
            padding: 10px 16px;
            border: none;
            border-radius: 16px 6px 16px 6px;
            background: linear-gradient(135deg, #2196f3, var(--blue-dark));
            color: #ffffff;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(15, 61, 110, 0.18);
        }
        .guest-box {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px dashed #c7e2fa;
            text-align: center;
        }
        .guest-hint {
            margin: 0 0 9px;
            font-size: 12px;
            color: var(--muted);
            line-height: 1.5;
        }
        .btn-guest {
            display: inline-block;
            width: 100%;
            padding: 9px 14px;
            border-radius: 16px 6px 16px 6px;
            background: #ffffff;
            color: var(--blue-dark);
            border: 1.5px solid #b3d8fa;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-guest:hover { background: #f3f9ff; }
    </style>
</head>
<body>
    <div class="clouds-bg" aria-hidden="true">
        <span class="mini-cloud" style="top: 5%; --w: 56px; --dur: 22s; --delay: -2s;"></span>
        <span class="mini-cloud" style="top: 12%; --w: 42px; --dur: 28s; --delay: -9s;"></span>
        <span class="mini-cloud" style="top: 20%; --w: 64px; --dur: 26s; --delay: -15s;"></span>
        <span class="mini-cloud" style="top: 28%; --w: 46px; --dur: 21s; --delay: -5s;"></span>
        <span class="mini-cloud" style="top: 37%; --w: 58px; --dur: 30s; --delay: -18s;"></span>
        <span class="mini-cloud" style="top: 46%; --w: 40px; --dur: 24s; --delay: -11s;"></span>
        <span class="mini-cloud" style="top: 55%; --w: 66px; --dur: 27s; --delay: -3s;"></span>
        <span class="mini-cloud" style="top: 64%; --w: 48px; --dur: 23s; --delay: -14s;"></span>
        <span class="mini-cloud" style="top: 73%; --w: 60px; --dur: 29s; --delay: -7s;"></span>
        <span class="mini-cloud" style="top: 82%; --w: 44px; --dur: 20s; --delay: -16s;"></span>
        <span class="mini-cloud" style="top: 89%; --w: 62px; --dur: 25s; --delay: -12s;"></span>
        <span class="mini-cloud" style="top: 94%; --w: 40px; --dur: 22s; --delay: -6s;"></span>
    </div>

    <main class="login-card">
        <div class="brand-center">
            <div class="hero-cloud">
                <h1 class="brand-name">Silent Loss Detector</h1>
            </div>
            <p class="brand-note">سجّل باسمك وبريدك للاحتفاظ بأرشيف عملياتك وحساباتك</p>
        </div>

        {% for _, msg in get_flashed_messages(with_categories=true) %}
            <div class="flash">{{ msg }}</div>
        {% endfor %}

        <form method="POST" action="/login">
            <div class="field-group">
                <label class="field-label" for="company_name">اسم المستخدم / الحساب</label>
                <input class="soft-input" type="text" id="company_name" name="company_name" placeholder="اكتب اسمك أو اسم نشاطك" required>
            </div>

            <div class="field-group">
                <label class="field-label" for="email">البريد الإلكتروني</label>
                <input class="soft-input" type="email" id="email" name="email" placeholder="name@example.com" required>
            </div>

            <div class="field-group">
                <label class="field-label" for="default_sector">النشاط الافتراضي</label>
                <select class="soft-select" id="default_sector" name="default_sector">
                    <option value="clothing">متاجر الملابس</option>
                    <option value="restaurants">المطاعم والكافيهات</option>
                    <option value="pharmacies">الصيدليات</option>
                    <option value="distribution">شركات التوزيع</option>
                </select>
            </div>

            <button type="submit" class="btn-main">دخول وحفظ الأرشيف</button>
        </form>

        <div class="guest-box">
            <p class="guest-hint">
                هل تفضل التجربة السريعة؟ <strong>الدخول كضيف</strong> يسمح لك باستخدام الموقع فوراً، لكن بيانات جلسة الضيف ستُحذف لاحقاً وتبدأ من جديد.
            </p>
            <form method="POST" action="/login">
                <input type="hidden" name="mode" value="guest">
                <button type="submit" class="btn-guest">المتابعة كضيف (بيانات مؤقتة)</button>
            </form>
        </div>
    </main>
</body>
</html>
